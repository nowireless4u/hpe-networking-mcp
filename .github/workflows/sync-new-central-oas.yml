name: Sync New Central OAS

# Pulls the Aruba developer-hub OpenAPI definitions (New Central MRT + config,
# AOS 8, UXI, ClearPass, AOS-CX) daily and opens an auto-merge PR with the
# refreshed vendored copies if they changed.
#
# Source: developer.arubanetworks.com is a ReadMe-hosted hub. Each project's API
# reference is split across many uploaded definitions. fetch_aruba_oas.py reads
# the reference page's ssr-props, resolves each current definition to its
# api-registry uuid (or, for registry-less ones, rebuilds it from the reference
# pages), validates it, and writes it under vendor/<project>/. **Tool
# regeneration does NOT happen here** — the maintainer re-runs the Central
# importer at release time so tool-surface changes are reviewed before tagging.
#
# Failures keep ONE open issue (fixed title) up to date instead of filing a new
# issue per day; the next successful run closes it.
#
# Branch protection on `main` requires PRs + status checks, and the default
# GITHUB_TOKEN cannot trigger downstream workflows on a PR it opens, so this
# uses a fine-grained PAT (secret: MIST_SYNC_PAT — shared with the Mist sync;
# rename to a generic OAS_SYNC_PAT and update both workflows if preferred) to
# open the PR and enable auto-merge.

on:
  schedule:
    # Daily at 07:00 UTC (staggered one hour after the Mist sync).
    - cron: "0 7 * * *"
  workflow_dispatch: # manual run via the Actions UI

permissions:
  contents: write # peter-evans needs this to push the sync branch
  pull-requests: write # to open / update the sync PR
  issues: write # to file an issue if the sync fails

concurrency:
  group: sync-new-central-oas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MIST_SYNC_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch + validate New Central OAS
        run: python3 .github/scripts/fetch_aruba_oas.py

      - name: Stamp UTC date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create or update sync PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.MIST_SYNC_PAT }}
          branch: chore/sync-new-central-oas
          delete-branch: true
          add-paths: |
            vendor/central/**
            vendor/aos8/**
            vendor/uxi/**
            vendor/clearpass/**
            vendor/aoscx/**
          commit-message: |
            chore(vendor): sync Aruba OAS — New Central, AOS 8, UXI, ClearPass, AOS-CX (${{ steps.date.outputs.today }}) (auto)

            Source: https://developer.arubanetworks.com (ReadMe api-registry)

            Tool regeneration not run by this workflow — maintainer re-runs the
            Central importer at release time before tagging.
          title: "chore(vendor): sync Aruba OAS (New Central, AOS 8, UXI, ClearPass, AOS-CX)"
          body: |
            Automated daily sync of the Aruba developer-hub OpenAPI definitions.

            - **Source**: https://developer.arubanetworks.com (ReadMe api-registry, discovered via each project's reference page)
            - **Vendored to**: `vendor/central/mrt/`, `vendor/central/config/`, `vendor/aos8/`, `vendor/uxi/`, `vendor/clearpass/`, `vendor/aoscx/`
            - Per-definition counts are in each project's `_manifest.json`; the
              workflow log records where each definition came from.

            Tool regeneration is **not** triggered by this PR — the maintainer
            re-runs the Central importer at release time so tool-surface changes
            are reviewed before shipping.

            This PR has auto-merge enabled and will merge once required status
            checks pass.

      - name: Enable auto-merge on the sync PR
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.MIST_SYNC_PAT }}

      - name: Open or update the sync-failure issue
        if: failure()
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --label openapi-sync --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title -q ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing on $(date -u +%Y-%m-%d): $run_url"
          else
            gh issue create --title "$ISSUE_TITLE" --label "openapi-sync,central" --body "The scheduled Aruba OAS sync is failing. The vendored copies under \`vendor/{central,aos8,uxi,clearpass,aoscx}/\` are NOT being updated.

          First failing run: $run_url

          Possible causes:
          - The developer hub changed how it serves definitions (the ssr-props registry list or the reference-page layout moved) — the run log's \`::error::\` line names the project and what was missing
          - A regression guard tripped: a definition count dropped, or a definition lost more than half its paths, vs the committed \`_manifest.json\` (a transient fetch miss, or a real upstream removal to review)
          - Network failure mid-sync

          This issue is updated on each further failure and closed automatically by the next successful sync. Fix in \`.github/scripts/fetch_aruba_oas.py\` if the portal structure changed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Aruba OAS sync failing"

      - name: Close the sync-failure issue once the sync succeeds
        if: success()
        run: |
          for n in $(gh issue list --state open --label openapi-sync --search "in:title \"$ISSUE_TITLE\"" \
              --json number,title -q ".[] | select(.title == \"$ISSUE_TITLE\") | .number"); do
            gh issue close "$n" --comment "Sync succeeded: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Aruba OAS sync failing"
