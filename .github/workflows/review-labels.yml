# review-labels: keeps each requested reviewer's <name>:<status> label in step with their reviews.
#
#   review:<name>     the review request; counts only when added by Leonardo or the repo owner
#   <name>:pending    no verdict on the current changes yet
#   <name>:changes    changes requested on the current changes
#   <name>:blocked    blocked on something outside the diff; survives new commits
#   <name>:cleared    cleared the current changes (not merge approval)
#
# The labels are a display. Nothing may gate, approve or merge on them; anything that does must re-read
# the reviews, their authors and the head commit itself.
#
# Verdicts come from the reviewer's own reviews. One "Verdict: cleared|changes|blocked" line, with nothing
# after the word, and the review type (Approve = cleared, Request changes = changes) are combined, and the
# stricter wins. Plain comments change nothing; a dismissed review is pending.
# A commit that changes the PR's own diff resets cleared/changes to pending; merging the base branch in or
# rebasing onto it does not. Review requests and status labels changed by anyone else are put back.
# Runs from the default branch only: pull_request_target directly, review events via review-labels-trigger.
name: review-labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_run:
    workflows: [review-labels-trigger]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # One run at a time per PR branch; a newer event waits and then reconciles from scratch.
  group: >-
    review-labels-${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sync:
    # Label events matter only for review:* and <name>:<status> labels (both contain a colon).
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review') ||
      (github.event_name == 'pull_request_target' &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        contains(github.event.label.name, ':')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Sync reviewer status labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys, urllib.parse

          REVIEWERS = {
              "leonardo": "leonardo-operations-lead[bot]",
              "raphael": "raphael-security-infrastructure[bot]",
              "michelangelo": "michelangelo-operator-experience[bot]",
              "donatello": "donatello-engineering-automation[bot]",
              "casey": "casey-delivery-coordinator[bot]",
          }
          REPO = os.environ["REPO"]
          # Who may add or remove review:<name>: Leonardo and the repository owner.
          ASSIGNERS = {"leonardo-operations-lead[bot]", REPO.split("/")[0]}
          STATES = ("pending", "changes", "blocked", "cleared")
          STRICTNESS = {"cleared": 0, "changes": 1, "blocked": 2}
          FENCE = re.compile(r"^[ \t]*(```|~~~).*?^[ \t]*\1[^\n]*$", re.M | re.S)
          VERDICT_LINE = re.compile(r"^[ \t*_#-]*verdict[ \t*_]*:(.*)$", re.I | re.M)
          VERDICT_WORD = re.compile(r"^[ \t*_`]*(cleared|changes|blocked)[ \t*_`.]*$", re.I)
          HUNK = re.compile(r"^@@[^@]*@@", re.M)
          DRY = os.environ.get("DRY_RUN") == "1"


          def gh(path, method="GET", body=None, paginate=False):
              cmd = ["gh", "api", "-X", method, path]
              if paginate:
                  cmd += ["--paginate", "--jq", ".[]"]
              if body is not None:
                  cmd += ["--input", "-"]
              out = subprocess.run(cmd, input=json.dumps(body) if body is not None else None,
                                   capture_output=True, text=True, encoding="utf-8")
              if out.returncode != 0:
                  raise RuntimeError(f"{method} {path}: {out.stderr.strip()}")
              if paginate:
                  return [json.loads(line) for line in out.stdout.splitlines() if line.strip()]
              return json.loads(out.stdout) if out.stdout.strip() else None


          def stricter(*verdicts):
              found = [v for v in verdicts if v]
              return max(found, key=STRICTNESS.get) if found else None


          def line_verdict(body):
              """The body's verdict line, ignoring code blocks and quotes; the stricter one if several."""
              text = FENCE.sub("", body or "")
              text = "\n".join(line for line in text.splitlines() if not line.lstrip().startswith(">"))
              words = [VERDICT_WORD.match(m.group(1)) for m in VERDICT_LINE.finditer(text)]
              return stricter(*(w.group(1).lower() for w in words if w))


          def verdict(review):
              """The verdict one review gives, or None when it gives none."""
              if review["state"] == "DISMISSED":
                  return "pending"
              typed = {"APPROVED": "cleared", "CHANGES_REQUESTED": "changes"}.get(review["state"])
              return stricter(line_verdict(review.get("body")), typed)


          _prints = {}


          def fingerprint(base_sha, sha):
              """Hash of the PR's own diff at `sha` (vs its merge base), or None when it can't be told."""
              if sha not in _prints:
                  try:
                      files = gh(f"repos/{REPO}/compare/{base_sha}...{sha}").get("files")
                  except RuntimeError:
                      files = None
                  if not files or len(files) >= 300 or any("patch" not in f for f in files):
                      _prints[sha] = None  # unknown, truncated, binary or mode-only: treat as changed
                  else:
                      parts = sorted(
                          f"{f['filename']}|{f.get('previous_filename', '')}|{f['status']}|{HUNK.sub('@@', f['patch'])}"
                          for f in files
                      )
                      _prints[sha] = hashlib.sha256("\n".join(parts).encode()).hexdigest()
              return _prints[sha]


          def status(reviews, login, head, base_sha):
              """The <status> one requested reviewer should show, and why."""
              latest = None
              for review in reviews:
                  if (review.get("user") or {}).get("login") == login and verdict(review):
                      latest = review
              if latest is None:
                  return "pending", "no verdict yet"
              given = verdict(latest)
              if given in ("pending", "blocked"):
                  return given, f"review {latest['id']}"
              sha = latest.get("commit_id")
              if sha == head:
                  return given, f"review {latest['id']} on the head"
              head_print = fingerprint(base_sha, head)
              if head_print is not None and fingerprint(base_sha, sha) == head_print:
                  return given, f"review {latest['id']}; later commits leave the diff unchanged"
              return "pending", f"{given} on {sha[:8]}; the diff changed since"


          def requested_reviewers(number):
              """Names whose review:<name> label was last added, not removed, by an assigner."""
              wanted = {}
              for event in gh(f"repos/{REPO}/issues/{number}/events?per_page=100", paginate=True):
                  name = (event.get("label") or {}).get("name", "")
                  actor = (event.get("actor") or {}).get("login")
                  if event["event"] in ("labeled", "unlabeled") and name.startswith("review:") and actor in ASSIGNERS:
                      wanted[name[len("review:"):]] = event["event"] == "labeled"
              return {n for n, on in wanted.items() if on and n in REVIEWERS}


          def write(number, add, remove):
              if add:
                  gh(f"repos/{REPO}/issues/{number}/labels", "POST", {"labels": add})
              for name in remove:
                  gh(f"repos/{REPO}/issues/{number}/labels/{urllib.parse.quote(name, safe='')}", "DELETE")


          def summarize(number, rows):
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary and rows:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(f"PR #{number}\n\n| Reviewer | Label | Why |\n| --- | --- | --- |\n")
                      fh.write("\n".join(rows) + "\n\n")


          def reconcile(number):
              pr = gh(f"repos/{REPO}/pulls/{number}")
              if pr["state"] != "open":
                  print(f"PR #{number} is closed; nothing to do.")
                  return
              head, base_sha = pr["head"]["sha"], pr["base"]["sha"]
              current = {label["name"] for label in pr["labels"]}
              requested = requested_reviewers(number)
              reviews = gh(f"repos/{REPO}/pulls/{number}/reviews?per_page=100", paginate=True) if requested else []
              desired, rows = {f"review:{n}" for n in requested}, []
              for name in sorted(requested):
                  state, why = status(reviews, REVIEWERS[name], head, base_sha)
                  desired.add(f"{name}:{state}")
                  rows.append(f"| {name} | {name}:{state} | {why} |")
              managed = {f"{n}:{s}" for n in REVIEWERS for s in STATES} | {f"review:{n}" for n in REVIEWERS}
              add, remove = sorted(desired - current), sorted((current & managed) - desired)
              print(f"PR #{number} head {head[:8]} requested={sorted(requested)} add={add} remove={remove}")
              summarize(number, rows)
              if DRY or not (add or remove):
                  return
              if gh(f"repos/{REPO}/pulls/{number}")["head"]["sha"] != head:
                  print(f"PR #{number} moved past {head[:8]} during this run; the queued run for the new head will reconcile.")
                  return
              write(number, add, remove)


          def pr_numbers():
              if os.environ.get("PR_NUMBER"):
                  return [os.environ["PR_NUMBER"]]
              head = os.environ.get("HEAD_SHA")  # review on a fork PR: workflow_run carries no PR number
              pulls = gh(f"repos/{REPO}/pulls?state=open&per_page=100", paginate=True) if head else []
              return [str(p["number"]) for p in pulls if p["head"]["sha"] == head]


          for pr_number in pr_numbers():
              reconcile(pr_number)
          PY
